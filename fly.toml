# fly.toml app configuration file generated for maltaman on 2026-07-23T10:49:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maltaman'
primary_region = 'fra'

[build]

[deploy]
  release_command = 'prisma migrate deploy'

[env]
  DATABASE_URL = 'file:/data/dev.db'
  NODE_ENV = 'production'
  PORT = '3000'
  STORAGE_DIR = '/data/storage'

[[mounts]]
  source = 'maltaman_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
