# fly.toml app configuration file generated for maltaman on 2026-07-23T10:49:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# NOTE: secrets added in the Fly dashboard are only STAGED until a "Deploy Secrets" run or the
# next code deployment applies them. If a secrets-only deploy keeps failing, merging any code
# change (like the commit that added this note) applies the staged secrets too.

app = 'maltaman'
primary_region = 'fra'

[build]

# No release_command: this app's database is SQLite on the mounted volume, but Fly's
# release_command machine has no volume attached — so migrations run at container startup
# instead, in the app machine that actually has the volume (see scripts/start.sh + Dockerfile).

[env]
  DATABASE_URL = 'file:/data/dev.db'
  NODE_ENV = 'production'
  PORT = '3000'
  STORAGE_DIR = '/data/storage'

[[mounts]]
  source = 'maltaman_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero when idle — deliberate cost/latency trade-off: the app is used in bursts during
  # a site visit, so paying for an always-warm machine is not worth it. The first request after an
  # idle period therefore pays a wake-up; warm requests are ~0.3s.
  #
  # 'suspend' rather than 'stop': a suspended machine resumes from its memory snapshot instead of
  # booting cold and re-running `prisma migrate deploy`, so the wake-up is far shorter. Set
  # min_machines_running = 1 if the wake-up ever becomes a problem on site.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
